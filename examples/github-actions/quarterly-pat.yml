# Example caller workflow — quarterly run, PAT auth.
#
# ┌──────────────────────────────────────────────────────────────────┐
# │  REQUIRED REPLACEMENTS                                           │
# │  Every `REPLACE_WITH_TAG_OR_SHA` token below MUST be replaced     │
# │  before this workflow is committed. They are NOT real refs;      │
# │  GitHub will reject the workflow on the first run if you leave    │
# │  them in (which is the deliberate failure mode — better than a   │
# │  silent stale pin). Use a release tag (e.g. `v0.2.0`) or a       │
# │  40-hex commit SHA. Latest tags:                                 │
# │     https://github.com/tomtom215/shipreport/releases             │
# │  Both the `uses:` ref AND the `shipreport_ref:` input must be set │
# │  to the same value. Do NOT ship `@main` to production — see      │
# │  docs/14-security.md.                                            │
# └──────────────────────────────────────────────────────────────────┘
#
# ┌──────────────────────────────────────────────────────────────────┐
# │  CAVEAT — quarterly cron + `mode: run`                           │
# │  GitHub's hosted scheduler may drop or delay any individual cron  │
# │  trigger. Because this workflow's cron fires only four times a   │
# │  year and uses `mode: run` directly (not `tick`), a single missed │
# │  trigger means the run is skipped for the entire quarter. If     │
# │  you can tolerate that risk, this pattern is the simplest. For   │
# │  delay-resistant deploys, prefer `hourly-tick.yml`, which        │
# │  dispatches `mode: tick` and re-checks the per-team `schedule:`  │
# │  field on every hourly trigger.                                  │
# └──────────────────────────────────────────────────────────────────┘
#
# Copy this into YOUR repo at `.github/workflows/quarterly.yml`. Provide:
#   * `shipreport.yaml` at the repo root with at least one team.
#   * Secret `SHIPREPORT_TOKEN` set to a fine-grained PAT (see
#     docs/03-auth-pat.md for the exact scopes).

name: shipreport-quarterly

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run | dry-run | doctor"
        required: false
        default: "run"
  schedule:
    - cron: "0 14 1 1,4,7,10 *"

permissions:
  contents: read

jobs:
  shipreport:
    # REPLACE: pin to the latest release tag or commit SHA.
    uses: tomtom215/shipreport/.github/workflows/reusable-shipreport.yml@REPLACE_WITH_TAG_OR_SHA
    with:
      config: shipreport.yaml
      mode: ${{ inputs.mode || 'run' }}
      # REPLACE: same pin as the `uses:` ref above. The reusable workflow
      # checks the source out at this ref and warns on floating refs.
      shipreport_ref: REPLACE_WITH_TAG_OR_SHA
    secrets:
      shipreport_token: ${{ secrets.SHIPREPORT_TOKEN }}
