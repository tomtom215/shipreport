# Example caller workflow — validate every PR that touches shipreport.yaml
# without ever calling GitHub APIs. Pairs with the hourly tick: this is the
# safety net that catches operator mistakes (typos, bad cron, missing
# repos:) BEFORE the bad config lands on main and starts firing every hour.
#
# ┌──────────────────────────────────────────────────────────────────┐
# │  REQUIRED REPLACEMENTS                                           │
# │  Every `REPLACE_WITH_TAG_OR_SHA` token below MUST be replaced     │
# │  before this workflow is committed. It is NOT a real ref; GitHub  │
# │  will reject the workflow on the first run if you leave it in.   │
# │  Use a release tag (e.g. `v0.2.0`) or a 40-hex commit SHA.       │
# │  Latest tags:                                                     │
# │     https://github.com/YOUR-GITHUB-OWNER/YOUR-FORK/releases             │
# │  Do NOT ship `@main` to production — see docs/14-security.md.    │
# └──────────────────────────────────────────────────────────────────┘
#
# Zero secrets required. Zero permissions beyond `contents: read`.
#
# Pre-requisites:
#   * `shipreport.yaml` at the repo root.
#
# Note: third-party action `uses:` lines below are pinned to 40-hex commit
# SHAs (with the human-readable tag in a trailing comment) to give every
# operator the SLSA-grade supply-chain anchor that shipreport's own CI
# uses. Refresh the SHAs when bumping action versions.

name: shipreport-validate

on:
  pull_request:
    paths:
      - "shipreport.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check out shipreport source (for the validator)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: YOUR-GITHUB-OWNER/YOUR-FORK
          # REPLACE: pin to the latest release tag or commit SHA.
          ref: REPLACE_WITH_TAG_OR_SHA
          path: shipreport
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: shipreport/pnpm-lock.yaml
      - name: Install + build
        working-directory: shipreport
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Validate shipreport.yaml
        run: node shipreport/scripts/validate-config.mjs shipreport.yaml
