# Example caller workflow — GitHub Enterprise Server (GHES) on a
# self-hosted runner inside your network.
#
# Required:
#   * Self-hosted runner with the label `shipreport` (or change `runs_on`
#     below). The runner needs network access to your GHES host and outbound
#     access to the npm registry / pnpm — air-gapped setups should bake the
#     `dist/` build into a private container instead; see
#     docs/10-deployment-docker.md.
#   * `shipreport.yaml` with `github.baseUrl` and `github.graphqlUrl`
#     pointing at your GHES install (https://ghe.example.com/api/v3 and
#     https://ghe.example.com/api/graphql respectively).
#   * Either SHIPREPORT_TOKEN (PAT) or SHIPREPORT_APP_PRIVATE_KEY (App).
#
# See docs/05-auth-ghes.md for the full GHES setup checklist.

name: shipreport-ghes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run | dry-run | doctor"
        required: false
        default: "run"
  schedule:
    - cron: "0 15 1 1,4,7,10 *"

permissions:
  contents: read

jobs:
  shipreport:
    uses: tomtom215/shipreport/.github/workflows/reusable-shipreport.yml@main
    with:
      config: shipreport.yaml
      mode: ${{ inputs.mode || 'run' }}
      runs_on: '["self-hosted", "shipreport"]'
    secrets:
      shipreport_token: ${{ secrets.SHIPREPORT_TOKEN }}
      shipreport_app_private_key: ${{ secrets.SHIPREPORT_APP_PRIVATE_KEY }}
