# Example caller workflow — quarterly run, GitHub App auth.
#
# ┌──────────────────────────────────────────────────────────────────┐
# │  REQUIRED REPLACEMENTS                                           │
# │  Every `REPLACE_WITH_TAG_OR_SHA` token below MUST be replaced     │
# │  before this workflow is committed. They are NOT real refs;      │
# │  GitHub will reject the workflow on the first run if you leave    │
# │  them in (which is the deliberate failure mode — better than a   │
# │  silent stale pin). Use a release tag (e.g. `v0.2.0`) or a       │
# │  40-hex commit SHA. Latest tags:                                 │
# │     https://github.com/YOUR-GITHUB-OWNER/YOUR-FORK/releases             │
# │  Both the `uses:` ref AND the `shipreport_ref:` input must be set │
# │  to the same value. Do NOT ship `@main` to production — see      │
# │  docs/14-security.md.                                            │
# └──────────────────────────────────────────────────────────────────┘
#
# ┌──────────────────────────────────────────────────────────────────┐
# │  CAVEAT — quarterly cron + `mode: run`                           │
# │  GitHub's hosted scheduler may drop or delay any individual cron  │
# │  trigger. Because this workflow's cron fires only four times a   │
# │  year and uses `mode: run` directly (not `tick`), a single missed │
# │  trigger means the run is skipped for the entire quarter. For    │
# │  delay-resistant deploys, prefer `hourly-tick.yml`.              │
# └──────────────────────────────────────────────────────────────────┘
#
# Copy this into YOUR repo at `.github/workflows/quarterly.yml`. Required:
#   * `shipreport.yaml` at the repo root with a `github.app` block — see
#     docs/04-auth-github-app.md for the exact shape.
#   * Secrets:
#       SHIPREPORT_APP_PRIVATE_KEY — App private key in PEM form.
#                                    \n-escaped is OK; literal newlines also OK.
#       SHIPREPORT_AUDIT_KEY        — optional ed25519 PEM for audit snapshots.
#
# App auth is recommended for enterprise: installation tokens are scoped to
# specific repos, expire hourly (auto-renewed at 50 min), and can't escape
# the org's permission policy. See docs/04-auth-github-app.md.

name: shipreport-quarterly

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run | dry-run | doctor"
        required: false
        default: "run"
      team:
        description: "Team name; empty for --all"
        required: false
  schedule:
    - cron: "0 14 1 1,4,7,10 *"

permissions:
  contents: read

jobs:
  shipreport:
    # REPLACE: pin to the latest release tag or commit SHA.
    uses: YOUR-GITHUB-OWNER/YOUR-FORK/.github/workflows/reusable-shipreport.yml@REPLACE_WITH_TAG_OR_SHA
    with:
      config: shipreport.yaml
      mode: ${{ inputs.mode || 'run' }}
      team: ${{ inputs.team || '' }}
      # REPLACE: same pin as the `uses:` ref above.
      shipreport_ref: REPLACE_WITH_TAG_OR_SHA
    secrets:
      shipreport_app_private_key: ${{ secrets.SHIPREPORT_APP_PRIVATE_KEY }}
      shipreport_audit_key: ${{ secrets.SHIPREPORT_AUDIT_KEY }}
