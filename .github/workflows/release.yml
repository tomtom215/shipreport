name: release

# Triggered on vX.Y.Z tag push. Publishes:
#   - npm package with provenance (sigstore via GitHub OIDC)
#   - multi-arch (linux/amd64, linux/arm64) Docker image to GHCR
#   - cosign keyless signature over the image digest (sigstore/OIDC)
#   - SBOM (CycloneDX JSON) via syft, attached to the GitHub release
#
# Pre-publish gates: full test matrix (typecheck/lint/test/build) and a
# fresh pnpm audit. Nothing ships until those pass.
#
# WILL-NOT-WORK-AS-IS for a recipient who unpacked this from an archive.
# This workflow assumes:
#   * `package.json#name` is `shipreport` and you're the npm-registry
#     owner of that name (you are not).
#   * `secrets.NPM_TOKEN` exists in your GitHub repo and is valid.
#   * GHCR credentials work for the repository `${GITHUB_REPOSITORY}`.
# Either rename the npm package (e.g. `@your-scope/shipreport`) and
# repoint the publish target, or delete this file. The CI gates in
# `ci.yml` are still useful and don't depend on any of the above.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create GitHub release + upload assets
  id-token: write     # OIDC for npm --provenance and cosign keyless
  packages: write     # GHCR push

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build

  npm-publish:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --provenance --no-git-checks

  docker-publish:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: tags
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.image }}:latest
          provenance: true
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Keyless-sign the image digest
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            "${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}"
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft \
            "${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}" \
            -o cyclonedx-json=shipreport-${{ steps.tags.outputs.version }}-sbom.cdx.json
      - name: Attach SBOM to the GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: shipreport-*-sbom.cdx.json
          body: |
            ## shipreport v${{ steps.tags.outputs.version }}

            - npm: published with `--provenance` (verifiable via `npm audit signatures`)
            - container: `ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.version }}` (multi-arch: amd64, arm64)
            - cosign: image digest signed keyless via Sigstore
            - SBOM attached above (CycloneDX JSON)
