name: shipreport-tick

# Hourly scheduled trigger plus on-demand dispatch. The cron is intentionally
# coarse: `shipreport schedule tick` reads each team's per-team cron from
# shipreport.yaml and runs only the teams whose schedule has come due since
# their last recorded run. Most hours that's a no-op.
#
# This workflow is a TEMPLATE. Operators fork the repo (or copy it into their
# own org's private repo), drop a `shipreport.yaml` at the repo root, and
# configure the secrets listed in docs/03-auth-pat.md or
# docs/04-auth-github-app.md. Without a config file at the repo root every
# scheduled invocation is a clean no-op so the upstream mirror stays green.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      team:
        description: "Team name (leave empty for --all)"
        required: false
      quarter:
        description: "Override quarter, e.g. 2026Q2 (optional)"
        required: false
      mode:
        description: "Run mode"
        required: true
        default: "run"
        type: choice
        options:
          - run         # full extract → render → write
          - dry-run     # cache-only; fails if cache cold
          - doctor      # auth + reachability + DB probe only
          - preview     # render one dev's story to the job log
      member:
        description: "Login (preview mode only)"
        required: false

permissions:
  contents: read

concurrency:
  # Prevents overlapping schedules from racing on the cached state DB if a
  # previous run is still finishing.
  group: shipreport-tick-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Detect operator config
        id: detect
        run: |
          if [ -f shipreport.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=shipreport.yaml found::Proceeding with operator config."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Template repo::No shipreport.yaml at repo root — this workflow is a template. See docs/02-quickstart.md."
          fi

      # A manual dispatch with no config is operator error: surface it loudly
      # rather than silently exiting 0.
      - name: Fail manual dispatch without config
        if: ${{ github.event_name == 'workflow_dispatch' && steps.detect.outputs.present != 'true' }}
        run: |
          echo "::error title=No shipreport.yaml::You dispatched this workflow manually but no shipreport.yaml was found at the repo root. Add one (see examples/shipreport.yaml) and try again."
          exit 1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.detect.outputs.present == 'true'
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.detect.outputs.present == 'true'
      - run: pnpm build
        if: steps.detect.outputs.present == 'true'

      # Restore the scheduler/audit state DB between runs. First run on a new
      # branch: cache miss → treated as "never run" and everything schedules.
      # Per-branch keying so a fork's state doesn't bleed into the upstream
      # mirror or vice versa.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: state-cache
        if: steps.detect.outputs.present == 'true'
        with:
          path: |
            ~/.local/share/shipreport
            ~/.cache/shipreport
          key: shipreport-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            shipreport-state-${{ github.ref_name }}-

      # Preflight on every invocation: cheap (no extract) and turns "wrong
      # secret name" / "expired PAT" / "App not installed on org" into a
      # readable error before we burn quota on a real extract.
      #
      # `--offline` skips the auth + GraphQL probes for dry-run mode so
      # operators iterating on classification rules without a token still
      # get a useful preflight (schema + cron + optional-deps validation).
      - name: Preflight (doctor)
        if: steps.detect.outputs.present == 'true'
        env:
          SHIPREPORT_GITHUB_TOKEN: ${{ secrets.SHIPREPORT_TOKEN }}
          SHIPREPORT_APP_PRIVATE_KEY: ${{ secrets.SHIPREPORT_APP_PRIVATE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "dry-run" ]; then
            node bin/shipreport.js doctor --config shipreport.yaml --offline
          else
            node bin/shipreport.js doctor --config shipreport.yaml
          fi

      - name: Doctor-only mode (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'doctor' && steps.detect.outputs.present == 'true' }}
        run: echo "Doctor probe completed — see preflight step above."

      - name: Scheduled tick
        if: ${{ github.event_name == 'schedule' && steps.detect.outputs.present == 'true' }}
        env:
          SHIPREPORT_GITHUB_TOKEN: ${{ secrets.SHIPREPORT_TOKEN }}
          SHIPREPORT_APP_PRIVATE_KEY: ${{ secrets.SHIPREPORT_APP_PRIVATE_KEY }}
        run: node bin/shipreport.js schedule tick --config shipreport.yaml --verbose

      - name: Manual run / dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'run' || inputs.mode == 'dry-run') && steps.detect.outputs.present == 'true' }}
        env:
          SHIPREPORT_GITHUB_TOKEN: ${{ secrets.SHIPREPORT_TOKEN }}
          SHIPREPORT_APP_PRIVATE_KEY: ${{ secrets.SHIPREPORT_APP_PRIVATE_KEY }}
        run: |
          set -e
          dry=""
          [ "${{ inputs.mode }}" = "dry-run" ] && dry="--dryRun"
          if [ -n "${{ inputs.team }}" ]; then
            node bin/shipreport.js run --config shipreport.yaml \
              --team "${{ inputs.team }}" \
              ${{ inputs.quarter && format('--quarter {0}', inputs.quarter) || '' }} \
              $dry --verbose
          else
            node bin/shipreport.js run --config shipreport.yaml --all \
              ${{ inputs.quarter && format('--quarter {0}', inputs.quarter) || '' }} \
              $dry --verbose
          fi

      - name: Manual preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' && steps.detect.outputs.present == 'true' }}
        env:
          SHIPREPORT_GITHUB_TOKEN: ${{ secrets.SHIPREPORT_TOKEN }}
          SHIPREPORT_APP_PRIVATE_KEY: ${{ secrets.SHIPREPORT_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${{ inputs.team }}" ] || [ -z "${{ inputs.member }}" ]; then
            echo "::error title=Missing inputs::Preview mode requires both 'team' and 'member' inputs."
            exit 1
          fi
          node bin/shipreport.js preview \
            --config shipreport.yaml \
            --team "${{ inputs.team }}" \
            --member "${{ inputs.member }}" \
            ${{ inputs.quarter && format('--quarter {0}', inputs.quarter) || '' }}

      - name: Upload reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.detect.outputs.present == 'true' && hashFiles('out/**/*') != '' }}
        with:
          name: shipreport-${{ github.run_id }}
          path: out/
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload audit tail
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.detect.outputs.present == 'true' }}
        with:
          name: shipreport-audit-${{ github.run_id }}
          path: ~/.local/share/shipreport/state.sqlite
          retention-days: 365
          if-no-files-found: ignore

      - name: Audit tail summary
        if: ${{ always() && steps.detect.outputs.present == 'true' }}
        run: node bin/shipreport.js audit tail --config shipreport.yaml --limit 20 || true

      - name: Verify audit chain
        # A broken hash chain is a stop-the-scheduler event per
        # SECURITY.md and docs/12-audit-log.md. We fail the job hard so
        # the red status is visible in the Actions UI; a missed yellow
        # warning would defeat the chain's purpose. The `audit verify`
        # CLI exits 1 on any chain break (cli.ts:296) and 0 otherwise.
        if: ${{ always() && steps.detect.outputs.present == 'true' }}
        run: node bin/shipreport.js audit verify --config shipreport.yaml
