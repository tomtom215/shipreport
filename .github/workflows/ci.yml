name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14
      - run: pnpm build

  audit:
    # Fails the build on any known high/critical prod-dep CVE.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  lint-workflows:
    # Structural sanity for GitHub Actions YAML.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"

  lint-markdown:
    # The sample outputs are checked in — if a template change mangles them,
    # markdownlint will catch structural breakage (unbalanced headings, bare
    # URLs, etc.) before a manager ever sees the result.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            examples/sample-output/**/*.md
            docs/**/*.md

  validate-examples:
    # End-to-end check: run scripts/validate-config.mjs over every checked-in
    # example YAML so a doc change that breaks the example reference fails
    # CI rather than landing silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/validate-config.mjs examples/shipreport.yaml
      - run: node scripts/validate-config.mjs examples/vllm.yaml
