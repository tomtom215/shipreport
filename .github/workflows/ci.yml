name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Matrix matches `engines.node` in package.json (>=22.13). The lowest
    # supported version, the current LTS, and the latest Current release
    # are all run on every PR so we catch behavior drift across
    # node:sqlite versions. Bump `25` to `26` (or higher) once that major
    # ships on the GitHub-hosted runner image — until then `setup-node`
    # rejects unknown majors with "Unable to find Node version 'N'".
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13", "24", "25"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && matrix.node-version == '24' }}
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14
      - run: pnpm build

  audit:
    # Fails the build on any known high/critical prod-dep CVE.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  lint-workflows:
    # Use the official actionlint binary (signed releases under
    # rhysd/actionlint), not a third-party action wrapper. Pinning by
    # SHA-256 gives us a deterministic supply-chain anchor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install actionlint (official binary)
        env:
          # actionlint v1.7.7 — checksum from
          # https://github.com/rhysd/actionlint/releases (verify before bumping)
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          # Retry against transient GitHub Releases 5xx / 429. Without
          # --retry, curl fails the whole job on the first blip (exit 22
          # for an HTTP error code).
          curl --fail --silent --show-error --location \
               --retry 5 --retry-delay 2 --retry-all-errors \
               -o actionlint.tgz \
               "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          chmod +x actionlint
      - run: ./actionlint -color .github/workflows/*.yml

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0
        with:
          globs: |
            examples/sample-output/**/*.md
            docs/**/*.md

  validate-examples:
    # End-to-end check: run scripts/validate-config.mjs over every checked-in
    # example YAML so a doc change that breaks the example reference fails
    # CI rather than landing silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/validate-config.mjs examples/shipreport.yaml
      - run: node scripts/validate-config.mjs examples/vllm.yaml
