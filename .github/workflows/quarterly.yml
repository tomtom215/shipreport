name: quarterly-shipreport

# Runs at 14:00 UTC on the first day of Jan / Apr / Jul / Oct.
on:
  schedule:
    - cron: "0 14 1 1,4,7,10 *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run shipreport
        env:
          SHIPREPORT_GITHUB_TOKEN: ${{ secrets.SHIPREPORT_TOKEN }}
        run: node bin/shipreport.js run --config shipreport.yaml --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: shipreport-${{ github.run_id }}
          path: out/
          retention-days: 90
